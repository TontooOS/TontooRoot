# GRUB loopback boot support.

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

if [ "${grub_platform}" == 'efi' ]; then
  archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
  archiso_platform='BIOS'
else
  archiso_platform="${grub_cpu}-${grub_platform}"
fi

default=archlinux
timeout=0
timeout_style=hidden

menuentry "Arch Linux (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
  set gfxpayload=keep
  linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=4G console=ttyS0,115200 quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 nowatchdog plymouth.ignore-serial-consoles init=/usr/bin/launchpad-daemon
  initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
