# TontooBoot Live ISO config.
# Apple style icon picker, Dark #1d1d1d, UEFI only.
# Template: %ARCHISO_UUID% is replaced by postprocess-refind.sh.

timeout 10
use_graphics true
hideui hints,badges
scanfor manual

# Theme
banner /EFI/refind/themes/tontooboot/banner.png
icons_dir /EFI/refind/themes/tontooboot/icons
selection_big /EFI/refind/themes/tontooboot/selection-big.png
font_size 14

# Load iso9660 driver so rEFInd can read the ISO filesystem.
drivers_dir /EFI/refind/drivers_x64

menuentry "TontooOS Live" {
    icon /EFI/refind/themes/tontooboot/icons/os_tontoo.png
    loader /arch/x86_64/vmlinuz-linux
    initrd /arch/x86_64/initramfs-linux.img
    options "archisobasedir=arch archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G console=ttyS0,115200 quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 nowatchdog plymouth.ignore-serial-consoles init=/usr/bin/launchpad-daemon --services-dir /System/services"
}

menuentry "TontooOS Live (Fallback)" {
    icon /EFI/refind/themes/tontooboot/icons/tool_recovery.png
    loader /arch/x86_64/vmlinuz-linux
    initrd /arch/x86_64/initramfs-linux-fallback.img
    options "archisobasedir=arch archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G console=ttyS0,115200 quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 nowatchdog init=/usr/bin/launchpad-daemon --services-dir /System/services"
}

menuentry "Shutdown" {
    halt
}

menuentry "Reboot" {
    reboot
}
