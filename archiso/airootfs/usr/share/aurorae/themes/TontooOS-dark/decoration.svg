<svg xmlns=http://www.w3.org/2000/svg width=100 height=100 version=1.1>
  <defs>
    <linearGradient id=grad-active x1=0% y1=0% x2=0% y2=100%>
      <stop offset=0% style=stop-color:#3a3a3a;stop-opacity:1 />
      <stop offset=100% style=stop-color:#2a2a2a;stop-opacity:1 />
    </linearGradient>
    <linearGradient id=grad-inactive x1=0% y1=0% x2=0% y2=100%>
      <stop offset=0% style=stop-color:#2d2d2d;stop-opacity:1 />
      <stop offset=100% style=stop-color:#1d1d1d;stop-opacity:1 />
    </linearGradient>
  </defs>
  <g id=decoration>
    <rect id=background-active x=0 y=0 width=100 height=100 fill=url(#grad-active) rx=8 ry=8/>
    <rect id=background-inactive x=0 y=0 width=100 height=100 fill=url(#grad-inactive) rx=8 ry=8 display=none/>
    <rect id=border x=0 y=0 width=100 height=100 fill=none stroke=#555555 stroke-width=1 rx=8 ry=8/>
  </g>
</svg>
