# FishPerms - TontooOS protected paths
# One absolute glob pattern per line. '#' starts a comment.
#
# Supported wildcards:
#   *   any characters within one path component
#   ?   one character within one path component
#   **  any number of path components
#
# Model: system binaries are hard-locked (immutable where supported).
# User data (~/Downloads, ~/Desktop, ...) is NOT listed here - it is
# gated with a user prompt via the daemon's access zones (see
# core::access::home_media_zones). ~/.config and all other folders stay
# unprotected by design.
#
# Protected system binaries (LaunchPad, app runner, shell stack)
/usr/bin/launchpad-daemon
/usr/bin/launchctl
/usr/bin/tapp
/usr/bin/fishperms-daemon
/usr/bin/fishpermctl
/usr/bin/tontoo-*

# Staged system helpers and scripts
/usr/local/bin/*

# System libraries and frameworks (additionally sealed read-only at boot,
# see core::sealmount::SEALED_MOUNTS - the lock below is best-effort)
/Library/System/**

# System application bundles (TBuild .app directories, e.g. Menubar.app;
# additionally sealed read-only at boot)
/System/Applications/**

# System daemon bundles (tapp bundles started by LaunchPad services,
# e.g. Settings.app)
/System/Daemons/**

# FishPerms own policy files - editing them would weaken the whole model.
# Grants and the verity manifest stay writable on purpose (the daemon must
# update them at runtime).
/Library/Preferences/FishPerms/trusted.conf
/Library/Preferences/FishPerms/protected.conf
