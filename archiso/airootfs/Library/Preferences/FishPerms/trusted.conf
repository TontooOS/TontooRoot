# FishPerms - trusted system executables (never asked, always allowed)
# Glob patterns matched against the process's canonical executable path.
#
# The TontooOS shell stack
/usr/bin/launchpad-daemon
/usr/bin/launchctl
/usr/bin/tapp
/usr/bin/fishbox
/usr/bin/fishperms-daemon
/usr/bin/fishpermctl
/usr/bin/fishperms-prompt
/usr/bin/tontoo-*
/usr/local/bin/*
/System/Applications/Menubar.app/**

# Core Linux daemons and session infrastructure
/usr/bin/NetworkManager*
/usr/sbin/NetworkManager
/usr/lib/systemd/*
/usr/libexec/*
/usr/bin/systemd*
/usr/bin/dbus*
/usr/bin/pipewire*
/usr/bin/wireplumber
/usr/bin/seatd*
/usr/sbin/sshd
/usr/bin/sshd
/usr/bin/plymouthd
/usr/bin/sudo
/usr/bin/su
/usr/bin/pkexec
/usr/bin/Xwayland
