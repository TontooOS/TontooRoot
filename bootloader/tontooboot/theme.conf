# TontooBoot theme. Dark default background #1d1d1d, Light #ececec.
# Banner is a 1920x1080 PNG filled with the background color.
# Icons are 144x144 PNGs rendered from icons/*.svg.

[Theme]
Background = #1d1d1d
BackgroundLight = #ececec
Foreground = #ffffff
SelectionRing = #ff6b2b
Accent = #ff6b2b
Font = SF Pro Display Regular
FontFallback = DejaVu Sans
IconSize = 144
Banner = banner.png
