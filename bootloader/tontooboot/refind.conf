# TontooBoot is the TontooOS boot picker built on rEFInd.
# Apple Startup Manager style icon picker, Dark default #1d1d1d.
# UEFI only. No systemd dependency.

timeout 5
use_graphics true
use_nvram false
shutdown_after_timeout false

# Apple style picker: icons centered, no text clutter.
hideui hints,badges
icons_dir themes/tontooboot/icons
banner themes/tontooboot/banner.png
banner_scale fillscreen
selection_big themes/tontooboot/selection-big.png
selection_small themes/tontooboot/selection-small.png
font_size 14

# Scan internal ESP + external USB like Apple picker.
scanfor internal,external,optical,manual
default_selection TontooOS
also_scan_dirs +,/boot
dont_scan_dirs /efi/EFI/BOOT,/efi/EFI/tools
showtools shell,memtest,gdisk,mok_tool,firmware,fwwifi,apple_recovery

# TontooOS kernel options. Init is launchpad-daemon, not systemd.
# Root is detected by refind_linux.conf or stanza below.
enable_and_lock_mac_headers false

menuentry "TontooOS" {
  icon themes/tontooboot/icons/os_tontoo.png
  volume "TontooOS"
  loader /vmlinuz-linux
  initrd /initramfs-linux.img
  options "root=UUID=TONTOO-ROOT rw quiet splash loglevel=3 vt.global_cursor_default=0 nowatchdog init=/usr/bin/launchpad-daemon --services-dir /System/services"
  enabled
}

menuentry "TontooOS Recovery" {
  icon themes/tontooboot/icons/tool_recovery.png
  volume "TontooOS"
  loader /vmlinuz-linux
  initrd /initramfs-linux-fallback.img
  options "root=UUID=TONTOO-ROOT rw single init=/usr/bin/launchpad-daemon --services-dir /System/services"
}

include themes/tontooboot/theme.conf
