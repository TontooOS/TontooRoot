name: Build ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 26.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: archlinux:latest
      options: --privileged
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out BaseOS
        uses: actions/checkout@v4
        with:
          # All scripts expect the repo in a folder named BaseOS
          # (local layout: <workspace>/BaseOS), so keep that layout here.
          path: BaseOS

      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git github-cli archiso rust python librsvg openssh \
            xorg-xcursorgen

      - name: Build ISO
        run: bash BaseOS/scripts/build-iso.sh --github-actions

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          iso_src="$(ls BaseOS/out/*.iso | head -n 1)"
          iso_name="tontoos-${{ inputs.version }}-x86_64.iso"
          mv "${iso_src}" "BaseOS/out/${iso_name}"
          cd BaseOS/out
          # GitHub release files are limited to 2 GiB each: split larger ISOs.
          if [[ "$(stat -c%s "${iso_name}")" -gt $((1800 * 1024 * 1024)) ]]; then
            split -b 1800M --numeric-suffixes=1 --suffix-length=2 \
              "${iso_name}" "${iso_name}.part-"
            rm "${iso_name}"
          fi
          sha256sum tontoos-* > "tontoos-${{ inputs.version }}-x86_64.iso.sha256"
          ls -la

      - name: Create release
        run: |
          set -euo pipefail
          cd BaseOS/out
          gh release create "${{ inputs.version }}" tontoos-* \
            --title "TontooOS ${{ inputs.version }}" \
            --notes "TontooOS BaseOS live ISO ${{ inputs.version }} (commit ${{ github.sha }}). If the ISO is split into .part-N files, rejoin with: cat <name>.part-* > <name>."
